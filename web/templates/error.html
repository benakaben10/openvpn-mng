<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>{{template "head" .}}</head>
<body>
    <div class="auth-page">
        <div class="auth-card text-center">
            <span class="auth-mark" style="background: linear-gradient(140deg, #f97316, #dc2626);">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </span>
            {{if .status}}<p class="text-muted-2 small fw-semibold mt-3 mb-0">Error {{.status}}</p>{{end}}
            <h1 class="auth-title">{{if .heading}}{{.heading}}{{else}}Something went wrong{{end}}</h1>
            <p class="auth-subtitle">{{.message}}</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
                <a href="/dashboard" class="btn btn-primary"><i class="bi bi-house me-2"></i>Back to dashboard</a>
                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                    <i class="bi bi-arrow-left me-2"></i>Go back
                </button>
            </div>
        </div>
    </div>
    {{template "scripts" .}}
</body>
</html>
