<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>{{template "head" .}}</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="text-center">
                <span class="auth-mark"><i class="bi bi-shield-lock-fill"></i></span>
                <h1 class="auth-title">OpenVPN Manager</h1>
                <p class="auth-subtitle">Sign in to manage secure access.</p>
            </div>

            <div id="loginAlert" class="alert alert-danger d-none mt-4" role="alert"></div>

            <form id="loginForm" class="mt-4" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                               autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                aria-label="Show password">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100" id="loginSubmit">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner" aria-hidden="true"></span>
                    <i class="bi bi-box-arrow-in-right me-2" id="loginIcon"></i>Sign in
                </button>
            </form>

            <div class="text-center mt-4">
                <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted-2" data-theme-toggle>
                    <i class="bi bi-moon-stars me-1" data-theme-icon></i>Switch theme
                </button>
            </div>
        </div>
    </div>

    {{template "scripts" .}}
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const loginSubmit = document.getElementById('loginSubmit');
        const loginSpinner = document.getElementById('loginSpinner');
        const loginIcon = document.getElementById('loginIcon');

        document.getElementById('togglePassword').addEventListener('click', () => {
            const field = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            const revealed = field.type === 'text';
            field.type = revealed ? 'password' : 'text';
            icon.className = revealed ? 'bi bi-eye' : 'bi bi-eye-slash';
        });

        function setLoginBusy(busy) {
            loginSubmit.disabled = busy;
            loginSpinner.classList.toggle('d-none', !busy);
            loginIcon.classList.toggle('d-none', busy);
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginAlert.classList.add('d-none');
            setLoginBusy(true);

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (response.ok) {
                    globalThis.location.href = '/dashboard';
                    return;
                }

                loginAlert.textContent = await apiErrorMessage(response, 'Invalid username or password');
                loginAlert.classList.remove('d-none');
            } catch {
                loginAlert.textContent = 'Connection error. Please try again.';
                loginAlert.classList.remove('d-none');
            } finally {
                setLoginBusy(false);
            }
        });
    </script>
</body>
</html>
