<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>{{template "head" .}}</head>
<body>
{{template "shell_open" .}}

<div class="page-header">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/users">Users</a></li>
                <li class="breadcrumb-item active" id="breadcrumbUser" aria-current="page">Loading…</li>
            </ol>
        </nav>
        <h1 class="page-header-title" id="userHeading">User detail</h1>
        <p class="page-header-subtitle" id="userSubheading">Account, VPN assignment and group membership.</p>
    </div>
    <div class="page-header-actions">
        <a href="/users" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to users</a>
    </div>
</div>

<div id="userContent">
    <div class="card">
        <div class="card-body">
            <div class="loading-row"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</div>
        </div>
    </div>
</div>

{{template "shell_close" .}}
{{template "scripts" .}}
<script>
    // The handler passes the path parameter through, so the page does not have
    // to re-parse window.location.
    const userId = {{.userID}};

    async function loadUser() {
        const container = document.getElementById('userContent');

        try {
            const [user, groupsData] = await Promise.all([
                api.get(`/api/v1/users/${userId}`),
                api.get(`/api/v1/users/${userId}/groups`).catch(() => ({ groups: [] })),
            ]);
            renderUser(user, (groupsData && groupsData.groups) || []);
        } catch (error) {
            container.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <div class="empty-state">
                            <span class="empty-state-icon text-danger"><i class="bi bi-exclamation-triangle"></i></span>
                            <p class="empty-state-title">Could not load this user</p>
                            <p class="empty-state-text">${escapeHtml(error.message)}</p>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    function renderUser(user, groups) {
        const fullName = [user.first_name, user.middle_name, user.last_name].filter(Boolean).join(' ');
        document.getElementById('breadcrumbUser').textContent = user.username;
        document.getElementById('userHeading').textContent = fullName;
        document.getElementById('userSubheading').textContent = `@${user.username} · ${user.email}`;

        const row = (icon, label, value) => `
            <div class="detail-row">
                <span class="detail-label"><i class="bi ${icon}"></i>${label}</span>
                <span class="detail-value">${value}</span>
            </div>
        `;
        const muted = (text) => `<span class="text-muted-2">${escapeHtml(text)}</span>`;

        const groupsHtml = groups.length === 0
            ? `<div class="empty-state">
                   <span class="empty-state-icon"><i class="bi bi-diagram-3"></i></span>
                   <p class="empty-state-title">No group membership</p>
                   <p class="empty-state-text">Without a group this user gets no routed networks.</p>
               </div>`
            : groups.map((group) => {
                const networks = (group.networks || [])
                    .map((n) => `<span class="pill pill-violet">${escapeHtml(n.name)} <code>${escapeHtml(n.cidr)}</code></span>`)
                    .join('');
                return `
                    <div class="mb-3">
                        <div class="d-flex align-items-center flex-wrap gap-2">
                            <span class="pill pill-blue">${escapeHtml(group.name)}</span>
                            ${group.description ? `<small class="text-muted-2">${escapeHtml(group.description)}</small>` : ''}
                        </div>
                        <div class="badge-stack mt-2">
                            ${networks || '<span class="text-muted-2 small">No networks routed</span>'}
                        </div>
                    </div>
                `;
            }).join('');

        document.getElementById('userContent').innerHTML = `
            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <span class="avatar avatar-lg mx-auto">${escapeHtml(initials(fullName))}</span>
                            <h2 class="h5 mt-3 mb-1">${escapeHtml(fullName)}</h2>
                            <p class="text-muted-2 mb-3">@${escapeHtml(user.username)}</p>
                            <div class="d-flex flex-wrap gap-2 justify-content-center">
                                ${rolePill(user.role)}${statusPill(user.is_active)}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card mb-3">
                        <div class="card-header">
                            <h2 class="card-header-title"><i class="bi bi-person-lines-fill"></i>Account</h2>
                        </div>
                        <div class="card-body">
                            <div class="detail-list">
                                ${row('bi-envelope', 'Email', escapeHtml(user.email))}
                                ${row('bi-telephone', 'Telephone', user.telephone ? escapeHtml(user.telephone) : muted('Not set'))}
                                ${row('bi-hdd-network', 'VPN IP', user.vpn_ip ? `<code>${escapeHtml(user.vpn_ip)}</code>` : muted('Assigned dynamically'))}
                                ${row('bi-calendar-check', 'Valid from', user.valid_from ? escapeHtml(toDateInput(user.valid_from)) : muted('No limit'))}
                                ${row('bi-calendar-x', 'Valid to', user.valid_to ? escapeHtml(toDateInput(user.valid_to)) : muted('No limit'))}
                                ${user.manager ? row('bi-person-workspace', 'Manager', escapeHtml(`${user.manager.first_name} ${user.manager.last_name}`)) : ''}
                                ${row('bi-clock', 'Created', escapeHtml(formatDateTime(user.created_at)))}
                                ${user.updated_at ? row('bi-clock-history', 'Updated', escapeHtml(formatDateTime(user.updated_at))) : ''}
                                ${row('bi-hash', 'ID', `<code class="small">${escapeHtml(user.id)}</code>`)}
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-header-title"><i class="bi bi-diagram-3"></i>Groups &amp; routed networks</h2>
                            <a href="/users" class="btn btn-sm btn-outline-secondary">Manage on Users</a>
                        </div>
                        <div class="card-body">${groupsHtml}</div>
                    </div>
                </div>
            </div>
        `;
    }

    document.addEventListener('DOMContentLoaded', loadUser);
</script>
</body>
</html>
